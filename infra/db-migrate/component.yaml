apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: db-migrate
  description: Applies database migrations to the stage and prod Cloudflare D1 databases
  labels:
    domain: infra
    scope: database
    team: platform
    layer: data

spec:
  type: db-migrate
  lifecycle: production
  owner: platform
  domain: infra

  dependsOn:
    - component: db
    # Migrations target the database the `cloudflare-d1` component creates, and
    # find it through the wiring document that component lease-publishes
    # post-apply.
    - component: cloudflare-d1

  path: packages/db/src/migrations

  parameters:
    nodeVersion: "20"
    pnpmVersion: "10.12.1"
    owner: sourceplane
    repo: test-finishline

  # Everything the runner needs to reach D1 over the REST API, all resolved
  # from orun secrets: the provider credential is minted fresh per run from the
  # Cloudflare integration's d1-edit template, the account id is a non-secret
  # connection fact, and the database id arrives in the wiring document the
  # cloudflare-d1 component lease-publishes.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://org_74d9eb0c2b3042c78a121a95683365f6/test-finishline/{{ .environment }}/CLOUDFLARE_D1_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://org_74d9eb0c2b3042c78a121a95683365f6/test-finishline/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    WIRING_CLOUDFLARE_D1: "secret://org_74d9eb0c2b3042c78a121a95683365f6/test-finishline/{{ .environment }}/WIRING_CLOUDFLARE_D1"

  subscribe:
    environments:
      - name: stage
        # A pull request deploys nothing, so nothing on one waits; a merge
        # keeps the ordering (migrations, infrastructure, the edge).
        dependencyRules:
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        # A pull request deploys nothing, so nothing on one waits; a merge
        # keeps the ordering (migrations, infrastructure, the edge).
        dependencyRules:
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
